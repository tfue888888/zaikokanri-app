<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name ="viewport"
    content="width=device-width,
    initial-scale=1.0">
    <title>在庫管理システム</title>

    <link rel="stylesheet" href="dashboard.css">
</head>
<body class="product-page">
    <div id="sideMenu" class="side-menu">
        <h2>メニュー</h2>
        <button id="dashboardButton" type="button">ダッシュボード</button>
        <button id="productButton" type="button">商品一覧</button>
        <button id="historyButton" type="button">操作履歴</button>

        <div class="csv-export-menu">
            <button id="csvExportToggle" type="button" class="csv-export-toggle" aria-expanded="false">CSV出力</button>
            <div id="csvExportMenu" class="csv-export-submenu">
                <button id="exportPurchaseHistoryBtn" type="button">発注履歴を出力</button>
                <button id="exportDiscardHistoryBtn" type="button">廃棄履歴を出力</button>
            </div>
        </div>

        <button id="logoutButton" type="button">ログアウト</button>
    </div>

    <header class="app-header">
        <div class="header-title">在庫管理システム</div>
        <div class="header-company-group">
            <div class="header-company">杉カンパニー</div>
            <button id="logoutBtn" type="button" class="logout-btn">ログアウト</button>
        </div>
    </header>

    <div class="menu-row">
        <button id="menuButton" class="menu-button" aria-label="メニュー">≡</button>
    </div>

    <main>
        <section class="section-title">
            <h2>商品一覧</h2>
        </section>

        <section class="product-form" id="productFormSection">
            <div class="product-form-header">
                <div class="product-form-title">商品追加</div>
                <button id="toggleAddFormBtn" type="button" class="toggle-form-btn" aria-expanded="false" aria-controls="addProductPanel">＋</button>
            </div>

            <div id="addProductPanel" class="product-add-panel">
                <input
                    type="text"
                    id="productName"
                    placeholder="商品名">

                <input
                    type="text"
                    id="janCode"
                    placeholder="JANコード"
                    maxlength="13"
                    inputmode="numeric"
                    pattern="\d*">

                <input
                    type="number"
                    id="stock"
                    placeholder="初期在庫"
                    inputmode="numeric"
                    pattern="\d*">

                <button id="addProductBtn" type="button" class="stock-btn">
                    追加する
                </button>
            </div>
        </section>

        <section class="purchase-order-section">
            <div class="purchase-order-header-row">
                <div class="section-title purchase-order-header">
                    <h2>発注管理</h2>
                </div>
                <button id="togglePurchaseOrderFormBtn" type="button" class="toggle-form-btn" aria-expanded="false" aria-controls="purchaseOrderPanel">＋</button>
            </div>

            <div id="purchaseOrderPanel" class="purchase-order-panel">
                <div class="purchase-order-form">
                    <select id="purchaseProductId" aria-label="発注商品選択">
                        <option value="">商品を選択</option>
                    </select>
                    <input id="purchaseSupplier" type="text" placeholder="仕入先名" maxlength="50">
                    <input id="purchaseQuantity" type="number" min="1" placeholder="発注数量" inputmode="numeric">
                    <input id="purchaseExpectedDate" type="date" placeholder="希望納品日">
                    <input id="purchaseNote" type="text" placeholder="備考（任意）" maxlength="255">
                    <button id="createPurchaseOrderBtn" type="button" class="stock-btn">発注を登録</button>
                </div>
            </div>

            <div id="purchaseOrderList" class="purchase-order-list" aria-live="polite"></div>
        </section>

        <section class="search-section" aria-label="商品検索">
            <div class="search-controls">
                <div class="search-input-group">
                    <div class="search-input-wrapper">
                        <input
                            type="text"
                            id="searchProduct"
                            placeholder="商品名・JANコードで検索">
                        <button id="clearSearchBtn" type="button" class="clear-input-btn" aria-label="検索文字をクリア">×</button>
                    </div>
                    <button id="searchProductBtn" type="button" class="search-btn" aria-label="検索">🔎</button>
                </div>
                <div class="pagination-info">
                    <div id="pageNumbers" class="page-numbers" aria-label="ページ番号"></div>
                    <div id="resultCount" class="result-count" aria-live="polite">0商品中0商品表示中</div>
                </div>
            </div>
        </section>

        <div id="productList" aria-live="polite" aria-atomic="true"></div>
    </main>

    <script src="dashboard.js"></script>

</body>
</html>
